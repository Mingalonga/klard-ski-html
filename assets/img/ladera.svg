<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
<!-- Ladera en primer plano. La superficie es una curva suave de (0, 56) a (100, 96)
     con control en (50, 84): main.js usa la misma curva para colocar a Klard sobre la nieve. -->
<defs>
<linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef4f8"/><stop offset="1" stop-color="#d3e2ee"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cb2d6" stop-opacity=".55"/><stop offset="1" stop-color="#8cb2d6" stop-opacity="0"/></linearGradient>
</defs>
<path d="M0 56 Q 50 84, 100 96 L100 100 L0 100 Z" fill="url(#n)"/>
<path d="M0 56 Q 50 84, 100 96 L100 99 Q 50 88, 0 60 Z" fill="url(#s)"/>
<g fill="none" stroke="#b9cfe2" stroke-width=".25" vector-effect="non-scaling-stroke">
<path d="M0 64 Q 50 90, 100 99"/><path d="M0 65.5 Q 50 91.5, 100 100"/>
</g>
</svg>
